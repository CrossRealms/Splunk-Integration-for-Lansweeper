version: 2
updates:
  - package-ecosystem: pip
    directory: /TA-lansweeper-add-on-for-splunk
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
